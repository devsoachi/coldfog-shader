name=coldFog shaderpack for Project Viewpoint
author=soachi
description= Heavy pale fog, film grain, chromatic aberration and optional pixel effects to give Project Zomboid a more uncanny and analog horror feel.
base=default

options=blue bluesaturation blueness warmdown bluecontrast bluevignette foglayer fogheight fogswirl fogsteps scanline scanlinesize fogBoost bluefog mist skyFog foglift foglevel skyFogDistance greenfog foglight grain chroma glow penetration halo lightcut darkvision pixel indoorfog colorbits mistboost visibility dithering wobble fogclump fogclumpsize stain stainwarm stainspots stainnight

option.blue.label=Blue look strength
option.blue.tooltip=Master blend of the whole blue grade. 0: default.
option.blue.range=0 1 0.05
option.blue.default=1

option.bluesaturation.label=Blue Saturation
option.bluesaturation.tooltip=How much color is left (1: as light, 0: black and white). including sky and clouds.
option.bluesaturation.range=0 1.5 0.05
option.bluesaturation.default=1

option.blueness.label=Blueness
option.blueness.tooltip=How strongly shadows lean blue-green and highlights go pale blue-grey.
option.blueness.range=0 1 0.05
option.blueness.default=0.8

option.indoorfog.label=Fog indoors
option.indoorfog.tooltip=How much fog you keep while inside a building (0: no fog, 1: same as outside) max visibility still applies
option.indoorfog.range=0 1 0.05
option.indoorfog.default=0.80

option.warmdown.label=Warm color removal
option.warmdown.tooltip=Pulls reds and oranges out of the image instead of only tinting over them.
option.warmdown.range=0 1 0.05
option.warmdown.default=0.7

option.bluecontrast.label=Contrast
option.bluecontrast.tooltip=Steeper tone curve around the mid-greys for more heavier shadows.
option.bluecontrast.range=0.8 1.6 0.05
option.bluecontrast.default=1

option.foglight.label=Light in fog
option.foglight.tooltip=Keeps the lamps coloured light inside the fog, also where Max visibility veils everything 0: off. Needs Volumetric light on.
option.foglight.range=0 2 0.05
option.foglight.default=0

option.bluevignette.label=Corner darkening
option.bluevignette.tooltip=Darkens the edges of the screen.
option.bluevignette.range=0 1 0.05
option.bluevignette.default=0.35

option.fogBoost.label=Fog thickening
option.fogBoost.tooltip=Makes the game own fog (for example in foggy weather) thicker nearer the eye. 0: default game fog.
option.fogBoost.range=0 4 0.1
option.fogBoost.default=1.5

option.bluefog.label=Fog grey
option.bluefog.tooltip=How far the fogs color is pulled to a pale cold grey (0: the games fog color).
option.bluefog.range=0 1 0.05
option.bluefog.default=0.5


option.foglevel.label=Fog level
option.foglevel.tooltip=How bright the fog is, independent of the sky. lower: dark and moody fog, higher: pale fog. 0: the fog takes the skys own brightness.
option.foglevel.range=0 0.6 0.01
option.foglevel.default=0.4

option.mist.label=Constant mist
option.mist.tooltip=Fog that is always there, denser with distance, no matter the weather. 0: off. Raise it to see a constant fog.
option.mist.range=0 0.15 0.005
option.mist.default=0.10

option.skyFog.label=Skyfog
option.skyFog.tooltip=How much the fog covers the sky: it fades to the fog color at the horizon and, in dense fog, up to the zenith. 0: sky without fog.
option.skyFog.range=0 1 0.05
option.skyFog.default=1

option.skyFogDistance.label=Sky fog reach
option.skyFogDistance.tooltip=At what distance the fog is measured to decide how dense it is over the sky. Lower: the sky fogs over sooner.
option.skyFogDistance.range=30 400 10
option.skyFogDistance.default=120

option.pixel.label=Pixel size
option.pixel.tooltip=Renders the image in big pixels, like low resolution console (1: off, 3-4 for a 32bit feel).
option.pixel.range=1 8 1
option.pixel.default=1

option.foglift.label=Fog brightness
option.foglift.tooltip=Makes the fog brighter without brightening the rest. The eye adapts to the fog and darkens it, this lifts it back. 0: off.
option.foglift.range=0 2 0.05
option.foglift.default=0.5

option.colorbits.label=Colorbits
option.colorbits.tooltip=Bits per color channel (8: off, 5: 15-bit color). Lower: more banding.
option.colorbits.range=3 8 1
option.colorbits.default=8

option.dithering.label=Dithering
option.dithering.tooltip=Ordered dithering pattern that hides the banding of the reduced color (only when color bits < 8).
option.dithering.range=0 1 0.05
option.dithering.default=0

option.wobble.label=Wobble
option.wobble.tooltip=Surfaces swim a little when you move and sit still when you stop. Like old consoles handle polygons on a 3D game. 0: off.
option.wobble.range=0 1 0.05
option.wobble.default=0

option.greenfog.label=Sickly
option.greenfog.tooltip=0: cold blue-grey fog. 1: pale greenish-ochre fog. Gives the fog his own tint whether is blue-grey or grennish tones.
option.greenfog.range=0 1 0.05
option.greenfog.default=0.10

option.grain.label=Film grain
option.grain.tooltip=Film noise, stronger in the mid-tones and shadows.
option.grain.range=0 1 0.05
option.grain.default=0.3

option.chroma.label=Chromatic aberration
option.chroma.tooltip=Red and blue split slightly towards the screen edges. 0: off.
option.chroma.range=0 1 0.05
option.chroma.default=0.25

option.glow.label=Light glow
option.glow.tooltip=Multiplies the engines bloom. It does nothing if Bloom is off.
option.glow.range=0 2 0.05
option.glow.default=0.25

option.penetration.label=Light penetration
option.penetration.tooltip=Bright lights lit windows, lamps cut through the fog instead of being veiled by it. 0 = off
option.penetration.range=0 1 0.05
option.penetration.default=0.6

option.halo.label=Light halo in fog
option.halo.tooltip=Soft glow around bright lights.
option.halo.range=0 2 0.05
option.halo.default=1

option.darkvision.label=Dark-vision
option.darkvision.tooltip=A faint cold floor of light in the darkest areas so the terrain stays visible at night. It fades out in brighter areas. 0: off.
option.darkvision.range=0 1 0.05
option.darkvision.default=0.4

option.visibility.label=Max visibility
option.visibility.tooltip=Distance (in squares) where the fog becomes total: nothing beyond it is seen, lights included. 0: off.
option.visibility.range=0 300 5
option.visibility.default=50

option.lightcut.label=Light threshold
option.lightcut.tooltip=How bright something has to be to count as a light for the glow and for light penetration. Lower it if lamps get no glow, raise it if bright walls glow.
option.lightcut.range=0.05 1.5 0.05
option.lightcut.default=0.6

option.mistboost.label=Engine mist thickening
option.mistboost.tooltip=Makes the engines own mist (the weathers, and the lamps volumetric light) thicker. The engine already keeps it out of interiors. 1: as the engine gives it. needs Volumetric light on.
option.mistboost.range=1 4 0.1
option.mistboost.default=1

option.foglayer.label=Fog layer
option.foglayer.tooltip=A thick visible layer of fog hugging the ground, carved by drifting patches, like the weather fog but always there. 0: off. Costs some performance.
option.foglayer.range=0 1 0.05
option.foglayer.default=0.5

option.fogheight.label=Fog layer height
option.fogheight.tooltip=How tall the fog layer is, in squares. Low: a bank at your feet. High: fog up to the rooftops.
option.fogheight.range=1 12 0.5
option.fogheight.default=4

option.fogswirl.label=Fog layer patches
option.fogswirl.tooltip=How uneven the layer is. 0: an even layer. 1: clear gaps and dense banks drifting with the wind.
option.fogswirl.range=0 1 0.05
option.fogswirl.default=0.6

option.fogsteps.label=Fog layer quality
option.fogsteps.tooltip=Samples along each ray. Lower is faster and noisier (the grain hides some), higher is smoother.
option.fogsteps.range=2 8 1
option.fogsteps.default=4

option.scanline.label=CRT scanlines
option.scanline.tooltip=Dark gaps between horizontal lines like a CRT screen. Bright areas bleed into the gaps. 0: off.
option.scanline.range=0 1 0.05
option.scanline.default=0

option.scanlinesize.label=Scanline size
option.scanlinesize.tooltip=Screen pixels per line. 2 or 3 is fine at 1080p. Match it with Pixel size for a low resolution look.
option.scanlinesize.range=2 8 1
option.scanlinesize.default=3

option.fogclump.label=Fog lumps
option.fogclump.tooltip=How lumpy the fog is: its front and its layer billow in puffs instead of a smooth wall. 0: off.
option.fogclump.range=0 1 0.05
option.fogclump.default=0.5

option.fogclumpsize.label=Fog lump size
option.fogclumpsize.tooltip=Size of the lumps in squares. Small: grainy and busy. Large: slow, heavy banks.
option.fogclumpsize.range=2 40 1
option.fogclumpsize.default=10

option.stain.label=Stain
option.stain.tooltip=Everything sinks into brown, like rust or rot. 0: off.
option.stain.range=0 1 0.05
option.stain.default=0

option.stainwarm.label=Stain warmth
option.stainwarm.tooltip=0: olive and ochre. 1: rust.
option.stainwarm.range=0 1 0.05
option.stainwarm.default=0.5

option.stainspots.label=Stain spots
option.stainspots.tooltip=Dark brown stains that sit on the surfaces, away from the lights. 0: off.
option.stainspots.range=0 1 0.05
option.stainspots.default=0

option.stainnight.label=Stain only at night
option.stainnight.tooltip=0: the stain is always there. 1: it only shows at dusk and at night.
option.stainnight.range=0 1 0.05
option.stainnight.default=0
