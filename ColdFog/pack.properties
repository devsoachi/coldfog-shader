name=coldFog shaderpack for Project Viewpoint
author=soachi
description= Heavy pale fog, film grain, chromatic aberration and optional pixel effects to give Project Zomboid a more uncanny and analog horror feel.
base=default

options=blue bluesaturation blueness warmdown bluecontrast bluevignette fogBoost bluefog mist skyFog skyFogDistance greenfog lowFog fogWisps grain chroma glow penetration halo lightcut darkvision pixel colorbits dithering wobble

option.blue.label=Blue look strength
option.blue.tooltip=Master blend of the whole blue grade. 0: default.
option.blue.range=0 1 0.05
option.blue.default=1

option.bluesaturation.label=Saturation
option.bluesaturation.tooltip=How much color is left (1: as light, 0: black and white). including sky and clouds.
option.bluesaturation.range=0 1.5 0.05
option.bluesaturation.default=0.35

option.blueness.label=Blueness
option.blueness.tooltip=How strongly shadows lean blue-green and highlights go pale blue-grey.
option.blueness.range=0 1 0.05
option.blueness.default=0.7

option.warmdown.label=Warm color removal
option.warmdown.tooltip=Pulls reds and oranges out of the image instead of only tinting over them.
option.warmdown.range=0 1 0.05
option.warmdown.default=0.6

option.bluecontrast.label=Contrast
option.bluecontrast.tooltip=Steeper tone curve around the mid-greys for more heavier shadows.
option.bluecontrast.range=0.8 1.6 0.05
option.bluecontrast.default=1.15

option.bluevignette.label=Corner darkening
option.bluevignette.tooltip=Darkens the edges of the screen.
option.bluevignette.range=0 1 0.05
option.bluevignette.default=0.35

option.fogBoost.label=Fog thickening
option.fogBoost.tooltip=Makes the game own fog (for example in foggy weather) thicker nearer the eye. 0: default game fog.
option.fogBoost.range=0 4 0.1
option.fogBoost.default=1.2

option.bluefog.label=Fog color
option.bluefog.tooltip=How far the fogs color is pulled to a pale cold grey (0: the games fog color).
option.bluefog.range=0 1 0.05
option.bluefog.default=0.85

option.mist.label=Constant mist
option.mist.tooltip=Fog that is always there, denser with distance, no matter the weather. 0: off. Raise it to see a constant fog.
option.mist.range=0 0.15 0.005
option.mist.default=0

option.skyFog.label=Skyfog
option.skyFog.tooltip=How much the fog covers the sky: it fades to the fog color at the horizon and, in dense fog, up to the zenith. 0: sky without fog.
option.skyFog.range=0 1 0.05
option.skyFog.default=1

option.skyFogDistance.label=Sky fog reach
option.skyFogDistance.tooltip=At what distance the fog is measured to decide how dense it is over the sky. Lower: the sky fogs over sooner.
option.skyFogDistance.range=30 400 10
option.skyFogDistance.default=120

option.pixel.label=Pixel size
option.pixel.tooltip=Renders the image in big pixels, like low resolution console (1: off, 3-4 for a 32bit feel).
option.pixel.range=1 8 1
option.pixel.default=1

option.colorbits.label=Colorbits
option.colorbits.tooltip=Bits per color channel (8: off, 5: 15-bit color). Lower: more banding.
option.colorbits.range=3 8 1
option.colorbits.default=8

option.dithering.label=Dithering
option.dithering.tooltip=Ordered dithering pattern that hides the banding of the reduced color (only when color bits < 8).
option.dithering.range=0 1 0.05
option.dithering.default=0.6

option.wobble.label=Wobble
option.wobble.tooltip=Surfaces swim a little when you move and sit still when you stop. Like old consoles handle polygons on a 3D game. 0: off.
option.wobble.range=0 1 0.05
option.wobble.default=0

option.greenfog.label=Fog tint
option.greenfog.tooltip=0: cold blue-grey fog. 1: pale greenish-ochre fog. Gives the fog his own tint whether is blue-grey or grennish tones.
option.greenfog.range=0 1 0.05
option.greenfog.default=0.45

option.lowFog.label=Low fog
option.lowFog.tooltip=Fog that pools near the ground and thins higher up. 0: off.
option.lowFog.range=0 1 0.05
option.lowFog.default=0.5

option.fogWisps.label=Fog banks
option.fogWisps.tooltip=Denser and thinner patches of fog across the world. 0: even fog.
option.fogWisps.range=0 1 0.05
option.fogWisps.default=0.35

option.grain.label=Film grain
option.grain.tooltip=Film noise, stronger in the mid-tones and shadows.
option.grain.range=0 1 0.05
option.grain.default=0.3

option.chroma.label=Chromatic aberration
option.chroma.tooltip=Red and blue split slightly towards the screen edges. 0: off.
option.chroma.range=0 1 0.05
option.chroma.default=0.25

option.glow.label=Light glow
option.glow.tooltip=Multiplies the engines bloom. It does nothing if Bloom is off.
option.glow.range=0 2 0.05
option.glow.default=1

option.penetration.label=Light penetration
option.penetration.tooltip=Bright lights lit windows, lamps cut through the fog instead of being veiled by it. 0 = off
option.penetration.range=0 1 0.05
option.penetration.default=0.6

option.halo.label=Light halo in fog
option.halo.tooltip=Soft glow around bright lights.
option.halo.range=0 2 0.05
option.halo.default=1

option.darkvision.label=Dark-vision
option.darkvision.tooltip=A faint cold floor of light in the darkest areas so the terrain stays visible at night. It fades out in brighter areas. 0: off.
option.darkvision.range=0 1 0.05
option.darkvision.default=0.4


option.lightcut.label=Light threshold
option.lightcut.tooltip=How bright something has to be to count as a light for the glow and for light penetration. Lower it if lamps get no glow, raise it if bright walls glow.
option.lightcut.range=0.05 1.5 0.05
option.lightcut.default=0.3

