name=coldFog shaderpack for Project Viewpoint
author=soachi
description= Follows the weather, yellow mornings, normal afternoon, orange dusks, film grain, chromatic aberration and optional pixel effects to give Project Zomboid a more uncanny and analog horror feel.
base=default

options=modern classic always daylook sun blue bluesaturation blueness warmdown bluecontrast bluevignette foglight grain chroma glow penetration halo lightcut darkvision pixel colorbits dithering wobble scanline scanlinesize stain stainwarm stainspots stainnight glare sodium fogtest

option.modern.label=Modern fog
option.modern.tooltip=Fog domes that drift and roll around you. Domes style
option.modern.range=0 1 0.05
option.modern.default=1

option.classic.label=Classic fog
option.classic.tooltip=Low fog (silent hill 1 type)
option.classic.range=0 1 0.05
option.classic.default=0

option.always.label=Always fog
option.always.tooltip=Keeps a fog of coldFog always there, at least this thick, even in clear weather. The natural fog of the game is never added on top of it. 0 is off.
option.always.range=0 1 0.05
option.always.default=0

option.daylook.label=Day shades
option.daylook.tooltip=Yellow mornings, cold afternoons and orange dusks. The night stays as it is. 0 is off.
option.daylook.range=0 1 0.05
option.daylook.default=1

option.sun.label=Sun disc
option.sun.tooltip=Draws the sun in the sky. It does not hide behind clouds. 0 is off.
option.sun.range=0 2 0.05
option.sun.default=1

option.blue.label=Blue look strength
option.blue.tooltip=Master blend of the whole blue grade. 0: default.
option.blue.range=0 1 0.05
option.blue.default=1

option.bluesaturation.label=Blue Saturation
option.bluesaturation.tooltip=How much color is left (1: as light, 0: black and white). including sky and clouds.
option.bluesaturation.range=0 1.5 0.05
option.bluesaturation.default=1

option.blueness.label=Blueness
option.blueness.tooltip=How strongly shadows lean blue-green and highlights go pale blue-grey.
option.blueness.range=0 1 0.05
option.blueness.default=0.8

option.warmdown.label=Warm color removal
option.warmdown.tooltip=Pulls reds and oranges out of the image instead of only tinting over them.
option.warmdown.range=0 1 0.05
option.warmdown.default=0.7

option.bluecontrast.label=Contrast
option.bluecontrast.tooltip=Steeper tone curve around the mid-greys for more heavier shadows.
option.bluecontrast.range=0.8 1.6 0.05
option.bluecontrast.default=1

option.bluevignette.label=Corner darkening
option.bluevignette.tooltip=Darkens the edges of the screen.
option.bluevignette.range=0 1 0.05
option.bluevignette.default=0.35

option.foglight.label=Light in fog
option.foglight.tooltip=Keeps the lamps coloured light inside the fog, also where Max visibility veils everything 0: off. Needs Volumetric light on.
option.foglight.range=0 2 0.05
option.foglight.default=0

option.grain.label=Film grain
option.grain.tooltip=Film noise, stronger in the mid-tones and shadows.
option.grain.range=0 1 0.05
option.grain.default=0.3

option.chroma.label=Chromatic aberration
option.chroma.tooltip=Red and blue split slightly towards the screen edges. 0: off.
option.chroma.range=0 1 0.05
option.chroma.default=0.25

option.glow.label=Light glow
option.glow.tooltip=Multiplies the engines bloom. It does nothing if Bloom is off.
option.glow.range=0 2 0.05
option.glow.default=0.25

option.penetration.label=Light penetration
option.penetration.tooltip=Bright lights lit windows, lamps cut through the fog instead of being veiled by it. 0 = off
option.penetration.range=0 1 0.05
option.penetration.default=0.6

option.halo.label=Light halo in fog
option.halo.tooltip=Soft glow around bright lights.
option.halo.range=0 2 0.05
option.halo.default=1

option.lightcut.label=Light threshold
option.lightcut.tooltip=How bright something has to be to count as a light for the glow.
option.lightcut.range=0.05 1.5 0.05
option.lightcut.default=0.6

option.darkvision.label=Dark-vision
option.darkvision.tooltip=A faint cold floor of light in the darkest areas so the terrain stays visible at night. It fades out in brighter areas. 0: off.
option.darkvision.range=0 1 0.05
option.darkvision.default=0.4

option.pixel.label=Pixel size
option.pixel.tooltip=Renders the image in big pixels, like low resolution console (1: off, 3-4 for a 32bit feel).
option.pixel.range=1 8 1
option.pixel.default=1

option.colorbits.label=Colorbits
option.colorbits.tooltip=Bits per color channel (8: off, 5: 15-bit color). Lower: more banding.
option.colorbits.range=3 8 1
option.colorbits.default=8

option.dithering.label=Dithering
option.dithering.tooltip=Ordered dithering pattern that hides the banding of the reduced color (only when color bits < 8).
option.dithering.range=0 1 0.05
option.dithering.default=0

option.wobble.label=Wobble
option.wobble.tooltip=Surfaces swim a little when you move and sit still when you stop. Like old consoles handle polygons on a 3D game. 0: off.
option.wobble.range=0 1 0.05
option.wobble.default=0

option.scanline.label=CRT scanlines
option.scanline.tooltip=Dark gaps between horizontal lines like a CRT screen. Bright areas bleed into the gaps. 0: off.
option.scanline.range=0 1 0.05
option.scanline.default=0

option.scanlinesize.label=Scanline size
option.scanlinesize.tooltip=Screen pixels per line. 2 or 3 is fine at 1080p. Match it with Pixel size for a low resolution look.
option.scanlinesize.range=2 8 1
option.scanlinesize.default=3

option.stain.label=Stain
option.stain.tooltip=Everything sinks into brown, like rust or rot. 0: off.
option.stain.range=0 1 0.05
option.stain.default=0

option.stainwarm.label=Stain warmth
option.stainwarm.tooltip=0: olive and ochre. 1: rust.
option.stainwarm.range=0 1 0.05
option.stainwarm.default=0.5

option.stainspots.label=Stain spots
option.stainspots.tooltip=Dark brown stains that sit on the surfaces, away from the lights. 0: off.
option.stainspots.range=0 1 0.05
option.stainspots.default=0

option.stainnight.label=Stain only at night
option.stainnight.tooltip=0: the stain is always there. 1: it only shows at dusk and at night.
option.stainnight.range=0 1 0.05
option.stainnight.default=0

option.glare.label=Light glare
option.glare.tooltip=Lights get a soft halo with faint rings, like the sun has, in their own color. 0: off.
option.glare.range=0 2 0.05
option.glare.default=0.75

option.sodium.label=Night Light
option.sodium.tooltip=Where a street lamp or a bulb kills other colors. At night only. 0: off.
option.sodium.range=0 1.5 0.05
option.sodium.default=1.0

option.fogtest.label=Fog test
option.fogtest.tooltip=debug
option.fogtest.range=0 1 0.05
option.fogtest.default=0
